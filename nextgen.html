    (function () {
      var t = "system";
      try { t = JSON.parse(localStorage.getItem("kd-profile") || "{}").theme || (JSON.parse(localStorage.getItem("kd-nextgen-v1") || "{}").prefs || {}).theme || "system"; } catch (e) {}
      if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
